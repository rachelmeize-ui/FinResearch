name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Local unit tests (no paid API calls)
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/research-engine-ui.js
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build server container
        run: docker build -t finresearch:hosting-check .
      - name: Private access and persistent research smoke test
        run: python3 scripts/check_container.py finresearch:hosting-check
